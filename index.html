<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilma Quest - Gráficos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* CENÁRIO */
    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(
        #45baff 0%,
        #91dcff 65%,
        #d5f5ff 100%
      );
    }

    /* SOL */
    .sun {
      position: absolute;
      top: 65px;
      right: 13%;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #fff4a3;
      box-shadow: 0 0 60px #fff1a0;
    }

    /* NUVENS */
    .cloud {
      position: absolute;
      width: 120px;
      height: 42px;
      border-radius: 50px;
      background: white;
      box-shadow:
        25px -20px 0 5px white,
        65px -12px 0 8px white;
    }

    .cloud1 {
      top: 100px;
      left: 12%;
    }

    .cloud2 {
      top: 190px;
      left: 55%;
      transform: scale(.8);
    }

    .cloud3 {
      top: 65px;
      left: 75%;
      transform: scale(.7);
    }

    /* MONTANHAS */
    .mountains {
      position: absolute;
      bottom: 145px;
      width: 120%;
      height: 280px;
      background: #8bc8a2;
      clip-path: polygon(
        0 100%, 0 65%, 15% 15%, 28% 70%,
        45% 5%, 62% 75%, 78% 20%,
        100% 80%, 100% 100%
      );
    }

    .mountains2 {
      position: absolute;
      bottom: 125px;
      width: 120%;
      height: 220px;
      background: #559b78;
      clip-path: polygon(
        0 100%, 10% 50%, 25% 80%,
        40% 20%, 58% 75%, 75% 35%,
        100% 85%, 100% 100%
      );
    }

    /* COLINAS */
    .hills {
      position: absolute;
      bottom: 70px;
      width: 120%;
      height: 180px;
      background: #65c96b;
      border-radius: 50% 50% 0 0;
    }

    /* ÁRVORES */
    .tree {
      position: absolute;
      bottom: 75px;
      width: 35px;
      height: 100px;
      background: #87502d;
      border-radius: 8px;
    }

    .tree::before {
      content: "";
      position: absolute;
      width: 95px;
      height: 95px;
      background: #218c43;
      border-radius: 50%;
      left: -30px;
      top: -55px;
      box-shadow: 15px -20px 0 #36a956;
    }

    .tree1 { left: 15%; }
    .tree2 { left: 55%; transform: scale(1.3); }
    .tree3 { right: 12%; transform: scale(.8); }

    /* CHÃO */
    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 85px;
      background: #a96a37;
      border-top: 15px solid #48bd4e;
    }

    /* PLATAFORMA */
    .platform {
      position: absolute;
      width: 180px;
      height: 35px;
      background: #bd793b;
      border-top: 10px solid #55d34d;
      border-radius: 5px;
      box-shadow: 0 5px 0 #75451f;
    }

    .platform1 {
      bottom: 230px;
      left: 20%;
    }

    .platform2 {
      bottom: 330px;
      left: 48%;
    }

    .platform3 {
      bottom: 230px;
      right: 12%;
    }

    /* BLOCOS */
    .block {
      position: absolute;
      width: 48px;
      height: 48px;
      background: linear-gradient(#ffcf55, #e99a29);
      border: 4px solid #a85b20;
      border-radius: 5px;
      box-shadow: inset 0 0 0 3px #ffe18b;
    }

    .block1 {
      bottom: 285px;
      left: 28%;
    }

    .block2 {
      bottom: 385px;
      left: 55%;
    }

    /* FLORES */
    .flower {
      position: absolute;
      bottom: 85px;
      font-size: 27px;
    }

    .flower1 { left: 8%; }
    .flower2 { left: 42%; }
    .flower3 { right: 25%; }

  </style>
</head>

<body>

  <main class="game">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="mountains"></div>
    <div class="mountains2"></div>
    <div class="hills"></div>

    <div class="tree tree1"></div>
    <div class="tree tree2"></div>
    <div class="tree tree3"></div>

    <div class="platform platform1"></div>
    <div class="platform platform2"></div>
    <div class="platform platform3"></div>

    <div class="block block1"></div>
    <div class="block block2"></div>

    <div class="flower flower1">🌼</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌻</div>

    <div class="ground"></div>

  </main>

</body>
</html>
